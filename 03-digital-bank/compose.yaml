services:
  app:
    build: .
    ports: ["8083:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/digitalbank
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: digitalbank, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d digitalbank"], interval: 5s, timeout: 3s, retries: 20 }
